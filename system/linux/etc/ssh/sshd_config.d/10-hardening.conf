# sshd hardening, restored from the old etc/ssh/sshd_config (Protocol 2 dropped: obsolete).
# Host-specific values are in 20-server.conf. The first value seen wins, and Ubuntu
# includes sshd_config.d/*.conf at the top of sshd_config.

KexAlgorithms curve25519-sha256@libssh.org,diffie-hellman-group-exchange-sha256
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com
HostKeyAlgorithms ssh-ed25519,ssh-ed25519-cert-v01@openssh.com,sk-ssh-ed25519@openssh.com,sk-ssh-ed25519-cert-v01@openssh.com,rsa-sha2-256,rsa-sha2-512,rsa-sha2-256-cert-v01@openssh.com,rsa-sha2-512-cert-v01@openssh.com
RekeyLimit 256M 1h

SyslogFacility AUTH
LogLevel VERBOSE

AuthenticationMethods publickey
PubkeyAuthentication yes
UsePAM yes
PasswordAuthentication no
PermitEmptyPasswords no
KbdInteractiveAuthentication no
KerberosAuthentication no
GSSAPIAuthentication no
HostbasedAuthentication no
IgnoreRhosts yes
PermitRootLogin no
StrictModes yes
LoginGraceTime 20
MaxAuthTries 3
MaxSessions 3
MaxStartups 3:30:10
AuthorizedKeysFile %h/.ssh/authorized_keys

AllowAgentForwarding no
AllowTcpForwarding no
GatewayPorts no
X11Forwarding no
PermitTunnel no
PermitUserEnvironment no

PrintMotd no
PrintLastLog yes
UseDNS no
Compression delayed

# Rely on the encrypted ClientAlive* messages below instead of TCP keepalive.
TCPKeepAlive no
ClientAliveInterval 30
ClientAliveCountMax 10

AcceptEnv LANG LC_*
Subsystem sftp /usr/lib/openssh/sftp-server -f AUTHPRIV -l INFO
