# Host-specific sshd values, restored from the old etc/ssh/sshd_config.
# AllowUsers locks out every other account: check it matches this machine before
# restarting sshd (`sshd -t`, then keep an open session while testing).

Port 2222
AddressFamily any
ListenAddress 0.0.0.0
AllowUsers sysad

# Only these host keys are used (HostKey lines replace the default set)
HostKey /etc/ssh/ssh_host_ed25519_key
HostKey /etc/ssh/ssh_host_rsa_key
