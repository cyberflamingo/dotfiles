---
default_install_hook_types: ["pre-commit", "pre-push"]
minimum_pre_commit_version: 4.0.0
repos:
  # Security
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-yaml
        # chezmoi templates are not plain YAML
        exclude: \.tmpl$
      # The Windows files and old bootstrap scripts have inconsistent file modes, so only scripts we own
      - id: check-executables-have-shebangs
        files: ^(tests|home/dot_local/bin)/
      - id: check-shebang-scripts-are-executable
        files: ^(tests|home/dot_local/bin)/
      - id: no-commit-to-branch
        stages: ["pre-commit"]
  # Shell scripts (the dotfiles themselves are checked by hand until cleaned up)
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229  # frozen: v0.11.0.1-1
    hooks:
      - id: shellcheck
        files: ^(tests|tools)/|^home/dot_local/bin/executable_(clipcopy|clippaste|copypath|mozilla-apply-overrides)$
        exclude: \.zsh$
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: 479be5958357ba5ab65ce47172117348516860e9  # frozen: v3.14.1-1
    hooks:
      - id: shfmt
        args: ["-i", "4", "-bn", "-ci"]
        files: ^(tests|tools)/|^home/dot_local/bin/executable_(clipcopy|clippaste|copypath|mozilla-apply-overrides)$
        exclude: \.zsh$
  # GitHub Actions
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint
  # Work terms that must never reach the public repo
  - repo: local
    hooks:
      - id: denylist
        name: Denylisted work terms (local list)
        language: script
        entry: tests/denylist-check.sh
